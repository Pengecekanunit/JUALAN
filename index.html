<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stok Kasir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f5f7; --surface: #ffffff; --ink: #13212c; --muted: #5d6c78; --line: #dbe2e8;
    --accent: #0b6e8f; --accent-ink: #ffffff;
    --ok: #17794a; --warn: #a8480a; --bad: #b42318;
    --warn-bg: #fdf0e3; --bad-bg: #fde8e6; --ok-bg: #e5f4ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a22; --surface: #16242f; --ink: #e8eef2; --muted: #93a4b1; --line: #26384a;
      --accent: #4cb4d6; --accent-ink: #08202b;
      --ok: #5fd39a; --warn: #f0a566; --bad: #ff8b80;
      --warn-bg: #3a2a1a; --bad-bg: #3d1f1d; --ok-bg: #173226;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 "Plus Jakarta Sans", system-ui, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 14px; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  .live { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--bad); }
  input[type=search], input[type=number], input[type=password], input[type=text] {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 10px;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .chip { padding: 8px 14px; font: 500 .9rem inherit; font-family: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; }
  li { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .nama { font-weight: 700; }
  .sub { font-size: .85rem; color: var(--muted); }
  .stok { min-width: 64px; text-align: center; padding: 6px 10px; border-radius: 10px; font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; background: var(--ok-bg); color: var(--ok); }
  .stok.low { background: var(--warn-bg); color: var(--warn); }
  .stok.out { background: var(--bad-bg); color: var(--bad); }
  .btn { padding: 10px 16px; font: 700 .95rem inherit; font-family: inherit; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  dialog { width: min(92vw, 380px); padding: 20px; border: 0; border-radius: 16px; background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 4px; font-size: 1.15rem; }
  label { display: block; margin: 14px 0 6px; font-size: .85rem; font-weight: 500; color: var(--muted); }
  .total { margin-top: 12px; font-weight: 700; }
  .err { min-height: 1.3em; margin-top: 10px; color: var(--bad); font-size: .9rem; }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
  .wrap { padding-bottom: 96px; }
  .cartbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1.5px solid var(--line); }
  .cartbar[hidden] { display: none; }
  .cartbar .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .cartbar b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .lines { margin: 12px 0 0; max-height: 40vh; overflow: auto; border: 1.5px solid var(--line); border-radius: 12px; }
  .line { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .line:last-child { border-bottom: 0; }
  .step { display: flex; align-items: center; gap: 6px; }
  .step button { width: 34px; height: 34px; font: 700 1.1rem inherit; font-family: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer; }
  .step span { min-width: 26px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tabs { margin-top: 0; }
  .sum { margin: 0 0 12px; padding: 12px 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; font-size: .9rem; color: var(--muted); }
  .hint { margin: 8px 0 0; font-size: .85rem; color: var(--muted); }
  section[hidden] { display: none; }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Stok barang</h1>
    <div class="live" role="status"><span class="dot" id="dot"></span><span id="status">Memuat…</span></div>
  </header>

  <div class="chips tabs" id="tabs">
    <button class="chip" data-t="Kasir" aria-pressed="true">Kasir</button>
    <button class="chip" data-t="Bahan" aria-pressed="false">Bahan baku</button>
    <button class="chip" data-t="Hpp" aria-pressed="false">HPP</button>
  </div>

  <section id="pKasir">
  <input type="search" id="q" placeholder="Cari nama atau kode barang" aria-label="Cari barang" autocomplete="off">
  <div class="chips" id="chips">
    <button class="chip" data-f="all" aria-pressed="true">Semua</button>
    <button class="chip" data-f="low" aria-pressed="false">Menipis</button>
    <button class="chip" data-f="out" aria-pressed="false">Habis</button>
  </div>

  <ul id="list" aria-live="polite"></ul>
    <p class="hint">Angka di kanan = porsi yang masih bisa dibuat dari stok bahan.</p>
  </section>

  <section id="pBahan" hidden>
    <p class="hint" style="margin:0 0 10px">Catat belanja bahan, kemasan, dan stiker di sini. Stok dan harga rata-rata ikut diperbarui.</p>
    <ul id="listB"></ul>
  </section>

  <section id="pHpp" hidden>
    <div class="sum" id="hSum"></div>
    <ul id="listH"></ul>
  </section>
</div>

<div class="cartbar" id="cartbar" hidden>
  <div class="in">
    <div><div class="sub" id="cCount"></div><b id="cBar"></b></div>
    <button class="btn" id="cOpen" type="button">Lihat keranjang</button>
  </div>
</div>

<dialog id="dlg">
  <h2>Keranjang</h2>
  <label for="dBeli">Nama pembeli</label>
  <input type="text" id="dBeli" maxlength="60" placeholder="Kosongkan jika umum" autocomplete="off">
  <div class="lines" id="lines"></div>
  <label for="dPin">PIN kasir</label>
  <input type="password" id="dPin" inputmode="numeric" autocomplete="off">
  <div class="total" id="dTotal"></div>
  <div class="err" id="dErr" role="alert"></div>
  <div class="row">
    <button class="btn ghost" id="dBatal" type="button">Tutup</button>
    <button class="btn" id="dOk" type="button">Catat penjualan</button>
  </div>
</dialog>
<dialog id="bDlg">
  <h2 id="bNama"></h2>
  <div class="sub" id="bInfo"></div>
  <label for="bQty">Jumlah dibeli</label>
  <input type="number" id="bQty" min="0" step="any" inputmode="decimal">
  <label for="bTotal">Total harga belanja (Rp)</label>
  <input type="number" id="bTotal" min="0" step="any" inputmode="numeric">
  <div class="total" id="bUnit"></div>
  <label for="bSup">Supplier (opsional)</label>
  <input type="text" id="bSup" maxlength="60" autocomplete="off">
  <label for="bPin">PIN kasir</label>
  <input type="password" id="bPin" inputmode="numeric" autocomplete="off">
  <div class="err" id="bErr" role="alert"></div>
  <div class="row">
    <button class="btn ghost" id="bBatal" type="button">Batal</button>
    <button class="btn" id="bOk" type="button">Catat pembelian</button>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
// GANTI dengan URL Web App dari Apps Script (berakhiran /exec)
const API_URL = "https://script.google.com/macros/s/AKfycbz9tY6-MnrtDzbvQjb659l4rxhjRYoWtOIf_x048cxfSSPf3TMsGJz9PgxMAfxYCfYB4w/exec";
const REFRESH_MS = 10000;

let items = [], bahan = [], ovh = { total: 0, target: 0, perPorsi: 0 }, filter = "all", tab = "Kasir", bCur = null;
const cart = {}; // kode -> jumlah
const $ = id => document.getElementById(id);
const rp = n => "Rp" + Number(n).toLocaleString("id-ID");
const find = k => items.find(i => i.kode === k);

function kelas(i) { return i.stok <= 0 ? "out" : i.stok <= i.min ? "low" : ""; }
function cartTotal() { return Object.keys(cart).reduce((t, k) => t + (find(k) ? find(k).harga * cart[k] : 0), 0); }
function cartCount() { return Object.keys(cart).reduce((t, k) => t + cart[k], 0); }

function render() {
  const q = $("q").value.trim().toLowerCase();
  const rows = items.filter(i =>
    (!q || i.nama.toLowerCase().includes(q) || i.kode.toLowerCase().includes(q)) &&
    (filter === "all" || (filter === "out" ? i.stok <= 0 : i.stok <= i.min))
  );
  const ul = $("list");
  ul.textContent = "";
  if (!rows.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.style.display = "block";
    li.textContent = items.length ? "Tidak ada barang yang cocok." : "Belum ada data stok.";
    ul.appendChild(li);
  }
  rows.forEach(i => {
    const li = document.createElement("li");
    const info = document.createElement("div");
    const n = document.createElement("div"); n.className = "nama"; n.textContent = i.nama;
    const s = document.createElement("div"); s.className = "sub"; s.textContent = i.kode + " · " + rp(i.harga);
    info.append(n, s);
    const st = document.createElement("div"); st.className = "stok " + kelas(i); st.textContent = i.stok;
    st.title = "Stok minimum: " + i.min;
    const b = document.createElement("button"); b.className = "btn";
    b.textContent = cart[i.kode] ? "Tambah (" + cart[i.kode] + ")" : "Tambah";
    b.disabled = i.stok <= 0 || (cart[i.kode] || 0) >= i.stok;
    b.onclick = () => { cart[i.kode] = (cart[i.kode] || 0) + 1; render(); };
    li.append(info, st, b);
    ul.appendChild(li);
  });
  renderBar();
}

function renderBar() {
  const c = cartCount();
  $("cartbar").hidden = c === 0 || tab !== "Kasir";
  $("cCount").textContent = c + " barang";
  $("cBar").textContent = rp(cartTotal());
}

function renderLines() {
  const box = $("lines");
  box.textContent = "";
  const ks = Object.keys(cart);
  if (!ks.length) { box.className = "lines empty"; box.textContent = "Keranjang kosong."; }
  else box.className = "lines";
  ks.forEach(k => {
    const it = find(k); if (!it) return;
    const row = document.createElement("div"); row.className = "line";
    const info = document.createElement("div");
    const n = document.createElement("div"); n.className = "nama"; n.textContent = it.nama;
    const s = document.createElement("div"); s.className = "sub"; s.textContent = rp(it.harga) + " × " + cart[k] + " = " + rp(it.harga * cart[k]);
    info.append(n, s);
    const step = document.createElement("div"); step.className = "step";
    const minus = document.createElement("button"); minus.type = "button"; minus.textContent = "−"; minus.setAttribute("aria-label", "Kurangi " + it.nama);
    const num = document.createElement("span"); num.textContent = cart[k];
    const plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+"; plus.setAttribute("aria-label", "Tambah " + it.nama);
    plus.disabled = cart[k] >= it.stok;
    minus.onclick = () => { cart[k]--; if (cart[k] <= 0) delete cart[k]; refreshDialog(); };
    plus.onclick = () => { if (cart[k] < it.stok) cart[k]++; refreshDialog(); };
    step.append(minus, num, plus);
    row.append(info, step);
    box.appendChild(row);
  });
  $("dTotal").textContent = "Total " + rp(cartTotal());
  $("dOk").disabled = ks.length === 0;
}

function refreshDialog() {
  renderLines(); render();
  if (!cartCount()) $("dlg").close();
}

async function load() {
  try {
    const r = await fetch(API_URL, { cache: "no-store" });
    const d = await r.json();
    if (!d.ok) throw new Error();
    items = d.items; bahan = d.bahan; ovh = d.overhead;
    // sesuaikan keranjang dengan stok terbaru
    Object.keys(cart).forEach(k => {
      const it = find(k);
      if (!it || it.stok <= 0) delete cart[k];
      else if (cart[k] > it.stok) cart[k] = it.stok;
    });
    $("dot").classList.remove("off");
    $("status").textContent = "Diperbarui " + new Date().toLocaleTimeString("id-ID");
    render(); renderBahan(); renderHpp();
    if ($("dlg").open) renderLines();
  } catch (e) {
    $("dot").classList.add("off");
    $("status").textContent = "Gagal memuat, mencoba lagi…";
  }
}

$("cOpen").onclick = () => {
  try { $("dPin").value = localStorage.getItem("pin") || ""; } catch (e) {}
  $("dErr").textContent = "";
  renderLines();
  $("dlg").showModal();
  $("dBeli").focus();
};
$("dBatal").onclick = () => $("dlg").close();

$("dOk").onclick = async () => {
  const pin = $("dPin").value;
  const list = Object.keys(cart).map(k => ({ kode: k, qty: cart[k] }));
  if (!list.length) return;
  if (!pin) { $("dErr").textContent = "Isi PIN kasir."; return; }
  $("dOk").disabled = true; $("dOk").textContent = "Menyimpan…";
  try {
    // text/plain agar tidak memicu preflight CORS di Apps Script
    const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action: "jual", items: list, pin, pembeli: $("dBeli").value.trim() }) });
    const d = await r.json();
    if (!d.ok) { $("dErr").textContent = d.error; return; }
    try { localStorage.setItem("pin", pin); } catch (e) {}
    Object.keys(cart).forEach(k => delete cart[k]);
    $("dBeli").value = "";
    $("dlg").close();
    toast("Tercatat. Total " + rp(d.total));
    await load();
  } catch (e) {
    $("dErr").textContent = "Koneksi gagal. Coba lagi.";
  } finally {
    $("dOk").disabled = false; $("dOk").textContent = "Catat penjualan";
  }
};

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 3000); }

const fmt = n => Number(n).toLocaleString("id-ID", { maximumFractionDigits: 2 });
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };

function renderBahan() {
  const ul = $("listB"); ul.textContent = "";
  if (!bahan.length) { const li = el("li", "empty", "Belum ada data bahan."); li.style.display = "block"; ul.appendChild(li); return; }
  bahan.forEach(b => {
    const li = el("li"), info = el("div");
    info.append(el("div", "nama", b.nama), el("div", "sub", b.kode + " · " + rp(b.harga) + " / " + b.satuan));
    const st = el("div", "stok " + (b.stok <= 0 ? "out" : b.stok <= b.min ? "low" : ""), fmt(b.stok) + " " + b.satuan);
    st.style.fontSize = ".95rem";
    const bt = el("button", "btn", "Beli"); bt.onclick = () => openBeli(b);
    li.append(info, st, bt); ul.appendChild(li);
  });
}

function renderHpp() {
  $("hSum").textContent = ovh.target
    ? "Biaya tetap " + rp(ovh.total) + " per bulan ÷ target " + fmt(ovh.target) + " porsi = " + rp(ovh.perPorsi) + " per porsi (tenaga kerja, listrik, dll)."
    : "Isi target porsi per bulan di sheet Biaya (sel E1) agar tenaga kerja dan listrik ikut dihitung.";
  const ul = $("listH"); ul.textContent = "";
  items.forEach(i => {
    const li = el("li"), info = el("div");
    info.append(el("div", "nama", i.nama), el("div", "sub", i.resep
      ? "Bahan + kemasan " + rp(i.hppBahan) + " + tenaga/listrik " + rp(i.hpp - i.hppBahan)
      : "Belum ada resep di sheet Resep"));
    const right = el("div"); right.style.textAlign = "right";
    const laba = i.harga - i.hpp, m = el("div", "sub", "Jual " + rp(i.harga) + " · margin " + (i.harga ? Math.round(laba / i.harga * 100) : 0) + "%");
    if (laba < 0) m.style.color = "var(--bad)";
    right.append(el("div", "nama", "HPP " + rp(i.hpp)), m);
    li.style.gridTemplateColumns = "1fr auto"; li.append(info, right); ul.appendChild(li);
  });
}

$("tabs").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  tab = b.dataset.t;
  document.querySelectorAll("#tabs .chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  ["Kasir", "Bahan", "Hpp"].forEach(t => $("p" + t).hidden = t !== tab);
  renderBar();
};

function updBeli() {
  const q = parseFloat($("bQty").value), t = parseFloat($("bTotal").value);
  $("bUnit").textContent = q > 0 && t > 0 ? "Harga per " + bCur.satuan + ": " + rp(t / q) : "";
}
function openBeli(b) {
  bCur = b;
  $("bNama").textContent = b.nama;
  $("bInfo").textContent = "Stok " + fmt(b.stok) + " " + b.satuan + " · harga rata-rata " + rp(b.harga) + " / " + b.satuan;
  $("bQty").value = ""; $("bQty").placeholder = "dalam " + b.satuan; $("bTotal").value = ""; $("bSup").value = "";
  try { $("bPin").value = localStorage.getItem("pin") || ""; } catch (e) {}
  $("bErr").textContent = ""; updBeli();
  $("bDlg").showModal(); $("bQty").focus();
}
$("bQty").oninput = updBeli; $("bTotal").oninput = updBeli;
$("bBatal").onclick = () => $("bDlg").close();
$("bOk").onclick = async () => {
  const qty = parseFloat($("bQty").value), total = parseFloat($("bTotal").value), pin = $("bPin").value;
  if (!(qty > 0) || !(total > 0)) { $("bErr").textContent = "Isi jumlah dan total harga."; return; }
  if (!pin) { $("bErr").textContent = "Isi PIN kasir."; return; }
  $("bOk").disabled = true; $("bOk").textContent = "Menyimpan…";
  try {
    const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action: "beli", kode: bCur.kode, qty, total, supplier: $("bSup").value.trim(), pin }) });
    const d = await r.json();
    if (!d.ok) { $("bErr").textContent = d.error; return; }
    try { localStorage.setItem("pin", pin); } catch (e) {}
    $("bDlg").close();
    toast(bCur.nama + " bertambah. Stok kini " + fmt(d.stok) + " " + bCur.satuan);
    await load();
  } catch (e) {
    $("bErr").textContent = "Koneksi gagal. Coba lagi.";
  } finally {
    $("bOk").disabled = false; $("bOk").textContent = "Catat pembelian";
  }
};

$("q").oninput = render;
$("chips").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  render();
};

load();
setInterval(load, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
